# Scope-aware PR checklist comment.
#
# Detects what the PR diff touches (api endpoint, SDK, MCP, infra, …)
# and posts a sticky comment listing the required follow-up steps for each
# scope. Re-runs on push so the comment stays in sync with the diff.
#
# The full checklist source-of-truth: docs/conventions/ENDPOINT-ADDITION.md.
# No paths filter by design — the scope detection runs on every PR, and the
# `pr-checklist` job name is the stable status-check context for the ruleset
# required-check flip.

name: PR checklist

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-checklist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect PR scope
        id: scope
        run: |
          set -euo pipefail
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          node scripts/governance/detect-pr-scope.mjs "$base" "$head" > /tmp/scope.json
          echo "scope_file=/tmp/scope.json" >> "$GITHUB_OUTPUT"

      - name: Render checklist comment
        id: render
        run: |
          node scripts/governance/render-checklist-comment.mjs /tmp/scope.json > /tmp/comment.md
          echo "comment_file=/tmp/comment.md" >> "$GITHUB_OUTPUT"

      - name: Post sticky comment
        # Fork PRs get a read-only token — posting would fail and red the
        # required context. Scope detection above still gates; only the
        # comment is skipped on forks.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          path: /tmp/comment.md
          header: pr-checklist
